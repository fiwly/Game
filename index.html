<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Quest</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><h1>NEON QUEST</h1><p>Fight • Earn • Upgrade • Survive</p></div><div class="money">🪙 <b id="coins">0</b></div></header><nav><button class="tab active" data-screen="play">PLAY</button><button class="tab" data-screen="shop">SHOP</button><button class="tab" data-screen="heroes">HERO</button><button class="tab" data-screen="save">SAVE</button></nav><section id="play" class="screen active"><div class="hud"><span>Stage <b id="stage">1</b>/5</span><span>❤️ <b id="hp">100</b></span><span>XP <b id="xp">0</b></span></div><canvas id="game" width="720" height="420"></canvas><div class="controls"><button id="left">◀</button><button id="attack">⚔ ATTACK</button><button id="right">▶</button></div><div class="actions"><button id="start">START STAGE</button><button id="next" disabled>NEXT STAGE</button></div><p id="status">Choose your hero, then start Stage 1.</p></section><section id="shop" class="screen"><h2>SHOP</h2><div id="shopItems" class="cards"></div></section><section id="heroes" class="screen"><h2>HERO</h2><div id="heroItems" class="cards"></div></section><section id="save" class="screen"><h2>SAVE DATA</h2><div class="savebox"><p>Your progress saves automatically on this device.</p><p>Coins, stage, hero and upgrades are stored locally.</p><button id="reset">RESET SAVE</button></div></section></main><script src="game.js"></script></body></html>
