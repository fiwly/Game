name: Build EchoesOfAether Android

on:
  push:
    paths:
      - 'android/EchoesOfAether/**'
      - '.github/workflows/build-echoes.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Unit tests
        working-directory: android/EchoesOfAether
        run: gradle test
      - name: Build debug APK
        working-directory: android/EchoesOfAether
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfAether-debug-apk
          path: android/EchoesOfAether/app/build/outputs/apk/debug/*.apk
